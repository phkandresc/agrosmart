<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroSmart - M.I.P. (static)</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 16px; }
      section { border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 6px; }
    </style>
    <!-- React UMD from CDN for quick static preview -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const e = React.createElement;

      function VistaDashboard() {
        return e('section', null,
          e('h2', null, 'VistaDashboard'),
          e('p', null, 'Panel principal con métricas y telemetría.')
        );
      }

      function VistaConfiguracion() {
        return e('section', null,
          e('h2', null, 'VistaConfiguracion'),
          e('p', null, 'Interfaz para ajustar parámetros de sensores y actuadores.')
        );
      }

      function App() {
        return e('div', null,
          e('h1', null, 'M.I.P. - AgroSmart (static)'),
          e(VistaDashboard, null),
          e(VistaConfiguracion, null)
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(App));
    </script>
  </body>
</html>
