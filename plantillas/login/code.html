<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AgroIoT Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden justify-center items-center p-6">
<!-- Main Content Wrapper -->
<div class="w-full max-w-[400px] flex flex-col gap-8">
<!-- Header Section -->
<div class="flex flex-col items-center gap-2">
<!-- Logo -->
<div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-[40px]">energy_savings_leaf</span>
</div>
<!-- Headline -->
<h1 class="text-gray-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center">
                    Welcome Back
                </h1>
<!-- Body Text -->
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal text-center">
                    Monitor your harvest in real-time.
                </p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-5 w-full">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-gray-900 dark:text-white text-sm font-medium leading-normal">
                        Email Address
                    </label>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal transition-all" placeholder="farmer@agrotech.com" type="email" value=""/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-gray-900 dark:text-white text-sm font-medium leading-normal">
                            Password
                        </label>
</div>
<div class="relative flex w-full items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 p-[15px] pr-12 text-base font-normal leading-normal transition-all" placeholder="••••••••••" type="password" value=""/>
<button class="absolute right-0 top-0 h-full px-4 flex items-center justify-center text-gray-400 hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="text-sm font-medium text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary hover:bg-[#0fd671] active:scale-[0.99] text-[#052e16] text-lg font-bold rounded-lg shadow-lg shadow-primary/30 transition-all flex items-center justify-center gap-2 mt-2">
                    Sign In
                </button>
</div>
<!-- Footer -->
<div class="text-center pt-2">
<p class="text-gray-500 dark:text-gray-400 text-sm">
                    New to AgroIoT? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Decorative Elements for subtle tech feel -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden -z-10 opacity-30">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute top-[60%] -right-[10%] w-[40%] h-[40%] bg-primary/5 blur-[100px] rounded-full"></div>
</div>
</div>
</body></html>
